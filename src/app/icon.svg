<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon en clave suiza: rectángulo, sin curvas, con las cinco bandas de tono
    de la paleta y un monograma calado. Coherente con el lienzo oscuro del
    sitio, así que en una pestaña oscura no se ve como un recorte blanco.
    Sin recursos externos: lo sirve la convención de App Router.
  -->
  <rect width="64" height="64" fill="#0b0b0c"/>
  <rect x="0" y="0" width="12.8" height="5" fill="#a29cf2"/>
  <rect x="12.8" y="0" width="12.8" height="5" fill="#4fd6c4"/>
  <rect x="25.6" y="0" width="12.8" height="5" fill="#f0b93d"/>
  <rect x="38.4" y="0" width="12.8" height="5" fill="#e08fd6"/>
  <rect x="51.2" y="0" width="12.8" height="5" fill="#f2896a"/>
  <path d="M16 18 H24 V40 H38 V48 H16 Z" fill="#ededea"/>
  <rect x="42" y="18" width="6" height="6" fill="#a29cf2"/>
</svg>
