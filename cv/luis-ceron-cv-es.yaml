# ---------------------------------------------------------------------------
# Diseno: formato Harvard, legible por un ATS.
#
# Cada opcion de aqui corrige un defecto MEDIDO extrayendo el texto del PDF
# anterior con pypdf, que es como lee un ATS. No son preferencias esteticas:
#
#  - theme: harvard          El tema clasico partia la entrada en columnas y el
#                            texto salia desordenado: primero las vinetas y
#                            DESPUES la empresa, el lugar y las fechas. Un
#                            parser que asocia fechas por proximidad las pega a
#                            la entrada equivocada. El tema harvard pone
#                            empresa, cargo, lugar y fecha en una sola linea,
#                            antes de las vinetas.
#  - alignment: left         El texto justificado activaba la particion de
#                            palabras de Typst: "inte-grating", "verti-cal",
#                            "peri-odic", "formal-ice". Una palabra clave
#                            partida por un guion no la encuentra ningun ATS.
#                            Alineado a la izquierda no hay guiones: medido, 0.
#  - phone_number_format     El formato "national" IMPRIMIA el numero sin el
#    international           +57. El PDF anterior decia "314 4087963", sin pais,
#                            en un CV que ofrece relocalizacion.
#  - display_urls_...: true  Antes ponia "luis-ceronmunoz" a secas junto a un
#                            icono; el icono no deja texto al extraer, asi que
#                            no habia forma de saber que eso era LinkedIn. Ahora
#                            imprime linkedin.com/in/... y github.com/...
#  - show_icons: false       Mismo motivo: un icono es un glifo sin texto.
#  - show_footer / top_note  El pie "Nombre - 1/2" y la nota "Ultima
#    en false                actualizacion" se colaban EN MEDIO del texto
#                            extraido, partiendo la seccion de Educacion.
#  - show_time_spans_in: []  Su valor por defecto es ['experience'] y compara
#                            contra el titulo LITERAL de la seccion: casaba con
#                            "Experience" y no con "Experiencia", asi que el PDF
#                            en ingles mostraba "3 months" bajo cada fecha y el
#                            espanol no. Dos CV con maquetacion distinta sin que
#                            nada lo declarara. Ya paso una vez y esta anotado en
#                            tasks/lessons.md; vuelve a pasar si se quita.
#  - degree_column: null     El titulo iba en una columna estrecha propia y
#                            Typst lo partia en vertical: el ingles extraia
#                            "Post-grad-uate Spe-cial-iza-tion" con guiones
#                            blandos, y el espanol pegaba "IngenieriaUniversidad"
#                            sin espacio. Ahora el titulo va en la misma linea
#                            que la institucion.
#  - size: a4                Estandar fuera de EE. UU. y 50pt mas de alto util
#                            que us-letter, que es el valor por defecto.
#
# Si tocas algo de aqui, vuelve a extraer el texto del PDF y comprueba que
# sigue saliendo limpio. El PDF se ve bien en pantalla aunque el texto
# extraido este roto: mirarlo no es verificarlo.
# ---------------------------------------------------------------------------
design:
  theme: harvard
  page:
    size: a4
    show_footer: false
    show_top_note: false
  typography:
    alignment: left
  header:
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
      phone_number_format: international
  sections:
    show_time_spans_in: []
    # Una seccion no se parte entre paginas: antes la pagina 2 empezaba con la
    # segunda entrada de Educacion, con su titulo de seccion abandonado en la
    # pagina 1, y quien abre por la 2 no sabe que esta leyendo. Ahora el corte
    # cae entre secciones: pagina 1 perfil y experiencia, pagina 2 el resto.
    allow_page_break: false
  templates:
    education_entry:
      degree_column: null

locale:
  language: spanish
