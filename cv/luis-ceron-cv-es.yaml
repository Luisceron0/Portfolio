    Perfil Profesional:
      - 'Ingeniero de Software Full-Stack orientado a arquitectura de software y seguridad de aplicaciones. Diseño sistemas de punta a punta (React, Angular, Vue.js, Spring Boot, Django, PostgreSQL) definiendo la estructura antes del primer archivo: límites entre módulos, contratos de datos y decisiones registradas en ADRs versionados. Incorporo la seguridad desde el diseño (RBAC, JWT, modelado de amenazas, SAST y SCA en el pipeline) y despliego en AWS y Docker con CI/CD. Egresado de Ingeniería de Software de la Universidad Cooperativa de Colombia y cursando una Especialización en Seguridad de la Información en el Politécnico Grancolombiano. Bilingüe (inglés C1, EF SET), con disponibilidad para relocalización.'

    Experiencia:
      - company: Alcaldía de Pasto
        position: Practicante de Ingeniería de Software Full-Stack
        location: Pasto, Colombia
        start_date: 2025-10
        end_date: 2025-12
        highlights:
          - 'Desarrollé de punta a punta el sistema de gestión de mantenimientos de una entidad pública, construyendo la interfaz de usuario, la lógica de backend y el modelo de datos, y lo entregué operativo dentro de los tres meses de la práctica.'
          - 'Implementé Control de Acceso Basado en Roles (RBAC) y sanitización de entradas del lado del servidor sobre un sistema que gestiona información de una entidad pública, cerrando las vías de inyección SQL y de XSS antes de la puesta en producción.'
          - 'Reestructuré la capa de acceso a datos y optimicé las consultas cuando los tiempos de respuesta se convirtieron en el cuello de botella del sistema, reduciendo la latencia de las pantallas de consulta más usadas.'
      - company: ElevaForge
        position: Cofundador e Ingeniero de Software
        location: Remoto
        start_date: 2025-06
        end_date: present
        highlights:
          - 'Cofundé un estudio de software de 3 ingenieros y asumí las decisiones de arquitectura del producto: definí los límites entre módulos y los contratos de datos, y dejé cada decisión y sus alternativas descartadas en ADRs versionados, de modo que el equipo puede revisarlas sin depender de mí.'
          - 'Dirigí la migración del sitio corporativo de Angular a Next.js 14, planificada por capas para que la estructura nueva absorbiera el contenido existente sin rehacerlo.'
          - 'Diseñé el modelo de autorización de la plataforma como deny-by-default: Row Level Security activa y sin ninguna política para el rol anónimo ni el autenticado, con todo el acceso a datos pasando por el servidor, así que la clave pública que viaja al navegador no habilita ninguna consulta.'
          - 'Establecí un estándar de seguridad en CI que corre en cada despliegue (CodeQL, reglas propias de Semgrep, audit-ci y gates de Lighthouse CI), de forma que un hallazgo detiene la entrega en lugar de descubrirse en producción.'
          - 'Construí elevaforge.com y la vertical de demostración KOA (landing y e-commerce) con un panel de administración multi-cuenta, con el que el equipo edita paquetes, proyectos y contenido sin un despliegue de por medio.'
      - company: Freelance
        position: Desarrollador de Software Full-Stack
        location: Remoto
        start_date: 2023-03
        end_date: present
        highlights:
          - 'Atendí clientes a medio tiempo en paralelo a la carrera universitaria y, después, a la práctica en la Alcaldía de Pasto, hasta formalizar esa disciplina de producto cofundando ElevaForge a mediados de 2025.'
          - 'Asumí encargos de alcance distinto según el cliente: interfaces de frontend, servicios de backend, desarrollos completos desde la interfaz hasta el despliegue, automatización de procesos internos y auditorías de seguridad sobre aplicaciones ya en operación.'
          - 'Ejecuté migraciones de datos hacia SAP y Oracle NetSuite aplicando cifrado y respaldos previos, de modo que cada corte tuviera un punto de retorno antes de mover el primer registro.'
          - 'Implementé soluciones CRM a medida (Salesforce, HubSpot) para negocios de e-commerce, incluyendo la configuración de controles de acceso por rol para que cada usuario opere solo sobre la cartera que le corresponde.'
          - 'Desarrollé sistemas de reportes automatizados con Odoo, Python y PostgreSQL que sustituyeron la consolidación manual de datos por una generación periódica para análisis de negocio.'
          - 'Parte de este trabajo está cubierta por acuerdos de confidencialidad, así que cada encargo se describe por su tipo de trabajo y su stack, nunca por el cliente ni por sus datos.'

